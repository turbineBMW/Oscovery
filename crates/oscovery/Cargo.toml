[package]
name = "oscovery"
description = "Find Omarchy apps and plugins by describing them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "oscovery"
path = "src/main.rs"

[dependencies]
oscovery-core = { path = "../oscovery-core" }
tracing.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
gio.workspace = true
glib.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
async-channel = "2"
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif"] }

[build-dependencies]
glib-build-tools = "0.22"
