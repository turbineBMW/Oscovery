# Builds the catalog index daily and publishes it on GitHub Pages:
#   https://<owner>.github.io/<repo>/index.json
# The build's memory lives on the site itself, fetched before each build, so
# nothing is committed back: first_seen.json (the Timeline) and opt_in.json
# (which repositories have an oscovery.toml, and up to when pushes were checked).
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: index

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/oscovery-index/**"
      - "crates/oscovery-core/**"
      - "sources/**"
      - ".github/workflows/index.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The crawl waits out GitHub's hourly limit rather than skip projects;
    # a run normally takes minutes.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Fetch the last build's memory from the live site
        run: |
          mkdir -p state
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          for file in first_seen.json opt_in.json; do
            curl -fsSL "$site/$file" -o "state/$file" || echo "no previous $file at $site (first build)"
          done
      - name: Build the index
        env:
          # Search needs a token for code and lifts the API limit from 60
          # requests an hour to 1,000.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo run --release -p oscovery-index -- build --out site --state state
      - name: Compress for the CDN
        run: gzip -9 -k site/index.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
