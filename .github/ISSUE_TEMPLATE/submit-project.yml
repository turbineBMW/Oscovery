name: Submit a project
description: Add your Omarchy app or plugin to the Oscovery catalog
title: "Submit: "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        Oscovery lists projects whose authors opted in. These are picked up
        automatically every day, with nothing to submit:

        - plugins listed on plugins.omarchy.org;
        - repositories with an `oscovery.toml` at the root of the default branch
          (an empty file is enough; see the README for the fields);
        - repositories tagged with the `omarchy-plugin` or `omarchy-app` topic.

        Use this form when code search hasn't seen your `oscovery.toml` yet, or to
        flag that you are looking for contributors. **Only submit a repository you
        own**: a submission is listed when the person opening this issue owns the
        repository, or the repository has an `oscovery.toml` or an opt-in topic.
  - type: input
    id: repo
    attributes:
      label: Repository
      placeholder: https://github.com/owner/name
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is it?
      options:
        - An app (desktop, terminal or tool)
        - An Omarchy shell plugin
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I maintain this repository and want it listed in Oscovery
          required: true
  - type: checkboxes
    id: contributors
    attributes:
      label: Collaboration
      options:
        - label: I am looking for contributors; show "Wants contributors" on the project page
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Install notes, which Omarchy version it needs, a related project it extends.
