[workspace]
resolver = "2"
members = ["crates/oscovery-core", "crates/oscovery", "crates/oscovery-index"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/turbinebmw/Oscovery"

[workspace.dependencies]
tracing = "0.1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip"] }
gio = { version = "0.22", features = ["v2_80"] }
glib = { version = "0.22", features = ["v2_80"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
